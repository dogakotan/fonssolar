gorev_tanimi:
- Teklif ve birim fiyat dosyalarından maliyet özetini çıkarmak
- Teklifleri kalem kalem karşılaştırmak; eksik kalemi işaretlemek
yapabilecekleri:
- Ticari etiketli dosyaları okumak
