# Yerel test yığını (Faz 1 Adım 5, Karar 52). Repo kökündeki supabase/ klasöründen AYRI çalışma dizini:
# kökteki supabase/migrations sıfırdan kurulamıyor (ilk migration projects/profiles'a dayanıyor), bu yüzden bu yığın
# migration'sız başlar; taban şema, referans veri, taslaklar ve tohum scripts/local-db/setup.mjs ile yüklenir.
# Portlar kökteki config.toml'dan farklı (iki yığın aynı anda çalışabilsin).
project_id = "fons-local"

[api]
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 55322
major_version = 17

[db.seed]
enabled = false

[studio]
port = 55323

[inbucket]
port = 55324

[auth]
site_url = "http://localhost:5183"
enable_signup = false

[auth.email]
enable_confirmations = false

[edge_runtime]
enabled = true

[analytics]
enabled = false
